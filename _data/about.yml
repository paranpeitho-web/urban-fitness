paragraph1: Urban Fit is more than a gym — it's a community. With a strong
  family vibe, a spacious facility, premium equipment, and a wide range of
  classes, we create a space where everyone feels supported and motivated.
paragraph2: >-
  Located at 156 Chadwick Road, Greerton, Urban Fitness is Tauranga’s ultimate
  fitness destination.


  With 24/7 gym access, 60+ weekly classes, Reformer Pilates, premium training equipment, and a passionate team, we offer everything you need to achieve your fitness goals.


  More than just a gym, we’re a community where everyone belongs, grows stronger, and thrives.
paragraph3: We're here to support our community — helping people grow stronger, together.
