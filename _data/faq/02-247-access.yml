question: "Is the gym open 24/7?"
answer: "Yes — members have 24/7 key fob access to the gym at all times. Staffed hours are Monday to Thursday 7:00am–7:30pm, Friday 8:00am–3:30pm, and Saturday to Sunday 8:00am–11:00am. Outside staffed hours, the gym is still fully accessible to all members."
order: 2
active: true
