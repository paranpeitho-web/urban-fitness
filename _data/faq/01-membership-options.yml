question: "What membership options are available?"
answer: "We offer four membership types: Standard, Student (Under 20), Senior (65+), and Corporate. All memberships are contract-free with no joining fee. Standard membership starts from $18.90/week on an 18-month term. Student and Senior memberships are available at discounted rates. For Corporate enquiries, please email support@urbanfitnessnz.com."
